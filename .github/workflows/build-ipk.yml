name: Build Luci App NVR (Dual Version)

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                  # tag 形如 v1.0.0 / v1.2.3-beta 时自动触发

jobs:
  build:
    name: Build for OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "23.05.6"
            sdk_url: "https://archive.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            pkg_type: "ipk"
          - version: "25.12.5"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            pkg_type: "apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip zstd
          sudo -E apt-get clean

      - name: Compile Package
        run: |
          set -e
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar
          mkdir -p sdk_env
          tar -xf sdk.tar -C sdk_env --strip-components=1

          PKG_DIR="sdk_env/package/luci-app-nvr"
          mkdir -p "$PKG_DIR"
          cp -a Makefile "$PKG_DIR/"
          [ -d luasrc ] && cp -a luasrc "$PKG_DIR/"
          [ -d files ]  && cp -a files/. "$PKG_DIR/"
          [ -d po ]     && cp -a po "$PKG_DIR/"

          cd sdk_env
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-app-nvr=m" >> .config
          make defconfig
          make package/luci-app-nvr/compile V=s -j2

          echo "==== 生成文件 ===="
          find bin/ -name "*.${{ matrix.pkg_type }}"

      # 1. 每个版本单独上传为 Artifact（手动触发时也能下载）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nvr-${{ matrix.version }}
          path: |
            sdk_env/bin/**/*.ipk
            sdk_env/bin/**/*.apk
          if-no-files-found: error

      # 2. tag 触发时，把产物发布到 Release
      - name: Rename packages with version prefix
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          TAG="${GITHUB_REF_NAME}"
          find sdk_env/bin -name "*.ipk" -o -name "*.apk" | while read f; do
            base=$(basename "$f")
            cp "$f" "release-assets/${TAG}_${{ matrix.version }}_${base}"
          done
          ls -la release-assets/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
