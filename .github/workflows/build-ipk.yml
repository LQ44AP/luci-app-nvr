name: Build Luci App NVR (Dual Version)

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                  # tag 形如 v1.0.0 时自动触发

permissions:
  contents: write             # 发布 Release 需要写权限

jobs:
  build:
    name: Build for OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "23.05.6"
            sdk_url: "https://archive.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            pkg_type: "ipk"
          - version: "25.12.5"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/generic/openwrt-sdk-25.12.5-x86-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            pkg_type: "apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip zstd
          sudo -E apt-get clean

      - name: Compile Package
        run: |
          set -e
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar
          mkdir -p sdk_env
          tar -xf sdk.tar -C sdk_env --strip-components=1

          PKG_DIR="sdk_env/package/luci-app-nvr"
          mkdir -p "$PKG_DIR"
          cp -a Makefile "$PKG_DIR/"
          [ -d luasrc ] && cp -a luasrc "$PKG_DIR/"
          [ -d files ]  && cp -a files/. "$PKG_DIR/"
          [ -d po ]     && cp -a po "$PKG_DIR/"

          cd sdk_env
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_luci-app-nvr=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-nvr-zh-cn=m" >> .config
          make defconfig

          make package/luci-app-nvr/compile V=s -j2
          make package/luci-i18n-nvr/compile V=s -j2 || true

          echo "==== 生成的 ${{ matrix.pkg_type }} 文件 ===="
          find bin/ \( -name "*luci-app-nvr*.ipk" -o -name "*luci-app-nvr*.apk" \
                    -o -name "*luci-i18n-nvr*.ipk" -o -name "*luci-i18n-nvr*.apk" \)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-nvr-${{ matrix.version }}
          path: |
            sdk_env/bin/**/*luci-app-nvr*.ipk
            sdk_env/bin/**/*luci-app-nvr*.apk
            sdk_env/bin/**/*luci-i18n-nvr*.ipk
            sdk_env/bin/**/*luci-i18n-nvr*.apk
          if-no-files-found: error

      - name: Collect packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          find sdk_env/bin \( -name "*luci-app-nvr*.ipk" -o -name "*luci-app-nvr*.apk" \
                            -o -name "*luci-i18n-nvr*.ipk" -o -name "*luci-i18n-nvr*.apk" \) \
            -exec cp {} release-assets/ \;
          echo "==== Release assets ===="
          ls -la release-assets/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ""
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
